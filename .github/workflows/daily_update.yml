name: Daily Court Auction Scraper (Seoul & Gyeonggi)

on:
  schedule:
    # 매일 UTC 21:00 = 한국 시간(KST) 매일 아침 06:00 자동 실행
    - cron: '0 21 * * *'
  workflow_dispatch: # 깃허브 웹 화면에서 [Run workflow] 버튼으로 즉시 수동 실행 가능

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python packages & Headless Browser
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium

      - name: Run Court Auction Direct Scraper
        run: |
          python scripts/fetch_auction.py

      - name: Commit and push updated auction data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/auction_data.json js/app.js
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): auto-update court auction listings [skip ci]" && git push)
