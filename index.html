<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>서울 아파트 경매</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/static/woff2/SUIT.css">
  <link rel="stylesheet" href="css/style.css?v=20261022_06">
</head>
<body>

  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="header-row">
        <h1 class="app-title">수도권 아파트 경매</h1>
        <div class="header-meta" id="header-meta">서울 · 경기 핵심지 자동 업데이트</div>
      </div>
    </header>

    <!-- Key Metrics (Toss-style clean cards) -->
    <section class="summary-bar" aria-label="요약 지표">
      <div class="summary-item">
        <span class="summary-label">전체 물건</span>
        <span class="summary-num" id="stat-total">-</span>
      </div>
      <div class="summary-item">
        <span class="summary-label">할인 물건</span>
        <span class="summary-num red" id="stat-discount">-</span>
      </div>
      <div class="summary-item">
        <span class="summary-label">신건</span>
        <span class="summary-num" id="stat-new">-</span>
      </div>
      <div class="summary-item">
        <span class="summary-label">이번주 마감</span>
        <span class="summary-num blue" id="stat-imminent">-</span>
      </div>
    </section>

    <!-- Apple-style Segmented Region Pills -->
    <div class="segmented-wrapper">
      <nav class="segmented-control" aria-label="권역 선택">
        <button type="button" class="pill-btn active" data-region="ALL">전체</button>
        <button type="button" class="pill-btn" data-region="서울">서울</button>
        <button type="button" class="pill-btn" data-region="광명">광명</button>
        <button type="button" class="pill-btn" data-region="성남">성남</button>
        <button type="button" class="pill-btn" data-region="안양">안양</button>
        <button type="button" class="pill-btn" data-region="수원">수원</button>
        <button type="button" class="pill-btn" data-region="용인">용인</button>
      </nav>
    </div>

    <!-- Seoul 5-Zone Sub-Pills (Shown when 서울 is selected) -->
    <div class="sub-segmented-wrapper" id="seoul-sub-wrapper" style="display: none;">
      <nav class="sub-segmented-control" aria-label="서울 생활권 선택">
        <button type="button" class="sub-pill-btn active" data-seoul-zone="ALL">서울 전체</button>
        <button type="button" class="sub-pill-btn" data-seoul-zone="SE" title="강남구 · 서초구 · 송파구 · 강동구">강남·동남권 <span class="zone-sub">강남4구</span></button>
        <button type="button" class="sub-pill-btn" data-seoul-zone="CENTER" title="마포구 · 용산구 · 성동구 · 광진구 · 종로구 · 중구">마용성·도심권</button>
        <button type="button" class="sub-pill-btn" data-seoul-zone="SW" title="양천구 · 영등포구 · 동작구 · 강서구 · 관악구 · 구로구 · 금천구">목동·서남권</button>
        <button type="button" class="sub-pill-btn" data-seoul-zone="NE" title="노원구 · 도봉구 · 강북구 · 성북구 · 동대문구 · 중랑구">노도강·동북권</button>
        <button type="button" class="sub-pill-btn" data-seoul-zone="NW" title="은평구 · 서대문구">은평·서북권</button>
      </nav>
    </div>

    <!-- Minimal Filter & Search Bar -->
    <section class="filter-bar" aria-label="상세 필터">
      <div class="search-box">
        <input type="text" id="input-search" class="search-input" placeholder="아파트명, 동네 검색">
      </div>
      <div class="filter-selects">
        <select id="select-households" class="select-clean" aria-label="세대수 필터">
          <option value="ALL">세대수 전체</option>
          <option value="300">300세대 이상</option>
          <option value="500">500세대 이상</option>
          <option value="1000">1,000세대 이상</option>
        </select>

        <!-- Compact Popover Price Slider (클릭 시 팝업) -->
        <div class="popover-wrapper" id="price-popover-wrapper">
          <button type="button" class="select-clean popover-trigger" id="btn-price-popover" aria-expanded="false" aria-haspopup="true">
            <span id="price-btn-label">가격 전체</span>
            <span class="dropdown-chevron">▾</span>
          </button>

          <div class="popover-menu" id="price-popover-menu" style="display: none;">
            <div class="popover-header">
              <span class="popover-title">최저가 구간 설정</span>
              <button type="button" id="btn-price-reset" class="popover-reset-btn">초기화</button>
            </div>
            
            <div class="popover-value-display">
              <span id="price-range-label" class="popover-price-val">가격 전체</span>
            </div>

            <div class="popover-presets">
              <button type="button" class="preset-chip" data-min="0" data-max="500000000">5억 이하</button>
              <button type="button" class="preset-chip" data-min="500000000" data-max="900000000">5억~9억</button>
              <button type="button" class="preset-chip" data-min="900000000" data-max="1500000000">9억~15억</button>
              <button type="button" class="preset-chip" data-min="1500000000" data-max="3000000000">15억+</button>
            </div>

            <div class="popover-slider-body">
              <div class="dual-range-wrap" id="price-slider-wrap">
                <div class="dual-range-track"></div>
                <div class="dual-range-fill" id="price-slider-fill"></div>
                <div class="dual-range-thumb" id="thumb-price-min" tabindex="0" role="slider" aria-label="최소 최저가"></div>
                <div class="dual-range-thumb" id="thumb-price-max" tabindex="0" role="slider" aria-label="최대 최저가"></div>
              </div>
              <div class="price-slider-ticks">
                <span>0원</span>
                <span>10억</span>
                <span>20억</span>
                <span>30억+</span>
              </div>
            </div>

            <div class="popover-footer">
              <span class="popover-step-hint">5천만원 단위</span>
              <button type="button" id="btn-price-apply" class="popover-apply-btn">확인</button>
            </div>
          </div>
        </div>

        <select id="select-discount" class="select-clean" aria-label="할인율 필터">
          <option value="ALL">할인 전체</option>
          <option value="disc20">20% 이상 할인</option>
          <option value="disc36">36% 이상 할인</option>
          <option value="new">신건만</option>
        </select>

        <select id="select-sort" class="select-clean" aria-label="정렬">
          <option value="dday_asc">마감 빠른순</option>
          <option value="discount_desc">할인율 높은순</option>
          <option value="min_price_asc">가격 낮은순</option>
          <option value="appraisal_desc">감정가 높은순</option>
        </select>
      </div>
    </section>

    <!-- Sub Toggles -->
    <div class="filter-sub-row">
      <div class="sub-toggles">
        <label class="check-label">
          <input type="checkbox" id="chk-safe">
          안전 권리만
        </label>
        <label class="check-label">
          <input type="checkbox" id="chk-bookmark">
          ★ 관심만
        </label>
      </div>
      <div class="count-text">
        <strong id="result-count">0</strong>건
      </div>
    </div>

    <!-- Auction Card Grid -->
    <main class="auction-grid" id="auction-grid">
      <!-- Injected by app.js -->
    </main>
  </div>

  <!-- Toss-style Sheet Modal (Calculator) -->
  <div class="modal-overlay" id="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-complex-title">
    <div class="modal-sheet">
      <div class="sheet-header">
        <div>
          <h2 class="sheet-title" id="modal-complex-title">-</h2>
          <div style="font-size:12px; color:var(--text-muted); margin-top:2px;" id="modal-case-no">-</div>
        </div>
        <button type="button" class="sheet-close" id="modal-close" aria-label="닫기">&times;</button>
      </div>

      <div class="calc-input-wrap">
        <label class="calc-input-label" for="calc-input-price">내 예상 입찰가</label>
        <input type="number" id="calc-input-price" class="sheet-input" step="10000000">
      </div>

      <div class="calc-result-list">
        <div class="calc-result-row">
          <span>입찰보증금 (10%)</span>
          <span id="res-deposit" style="font-weight:700;">-</span>
        </div>
        <div class="calc-result-row">
          <span>낙찰 잔금</span>
          <span id="res-balance">-</span>
        </div>
        <div class="calc-result-row">
          <span>예상 대출 (LTV 70%)</span>
          <span id="res-loan" style="color:var(--toss-blue); font-weight:700;">-</span>
        </div>
        <div class="calc-result-row">
          <span>취득세 (1주택 기준)</span>
          <span id="res-tax">-</span>
        </div>
        <div class="calc-result-row">
          <span>부대비용 (명도+법무)</span>
          <span id="res-extra">-</span>
        </div>
        <div class="calc-result-row highlight">
          <span>필요 현금 (자기자본)</span>
          <span class="total-val" id="res-total">-</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Popover Backdrop -->
  <div class="popover-backdrop" id="popover-backdrop" style="display: none;"></div>

  <!-- Toast -->
  <div id="toast" class="toss-toast"></div>

  <script src="js/app.js?v=20261022_06"></script>
</body>
</html>
